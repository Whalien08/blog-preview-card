<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }

    body {
      background-color: hsl(47, 88%, 63%);
      text-align: left;
      font-family: "Figtree", sans-serif;
    }
    
    .sub1 {
      background-color: hsl(47, 88%, 63%);
      width: 6.25rem;
      border-radius: 0.3125rem;
      height: 1.5625rem;
      margin: 1.25rem;
      font-size: 1rem;
      text-align: center;
      font-weight: bold;
      margin-inline-start: 1px;
    }
    
    .main {
      background-color: hsl(0, 0%, 100%);
      max-width: 20rem;
      border-radius: 0.9375rem;
      margin: 3.125rem auto;
      padding: 1.25rem;
      border: 1px black solid;
      box-shadow: 8px 8px 0px 0px black;
      margin-block-start: 6.25rem;
    }
    
    .sub3 {
      color: hsl(0, 0%, 42%);
      font-size: 1.25rem; 
      text-align: left;
      font-weight: 800;
      cursor: pointer;
      transition: color 0.3s ease;
    }
    
    .sub3:hover {
      color: hsl(47, 88%, 63%);
    }
    
    .sub2 {
      color: hsl(0, 0%, 42%);
    }
    
    img {
      width: 100%;
      border-radius: 0.625rem;
    }
    
    .avatar {
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
    }
    
    .author-name {
      font-weight: bold;
      font-size: 0.875rem; 
      margin-inline-start: 0.3125rem; 
    }
    
    .sub4 {
      display: flex;
      align-items: center;
      gap: 0.1875rem;
      margin-block-start: 1.875rem;
    }
  </style>
</head>
<body>

  <main class="main">
    <img src="./assets/images/illustration-article.svg" alt="image">
    <div class="sub1">Learning</div>

    <p>Published <time datetime="2023-12-21">21 Dec 2023</time></p>

    <h1 class="sub3">HTML & CSS foundations</h1>

    <p class="sub2">These languages are the backbone of every website, defining structure, content, and presentation.</p>
    
    <div class="sub4">
      <img class="avatar" src="./assets/images/image-avatar.webp" alt="Greg Hooper">
      <span class="author-name">Greg Hooper</span>
    </div>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Mithra Xavier</a>.
  </footer>
</body>
</html>
